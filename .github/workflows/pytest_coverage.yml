name: pytest and coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest and coverage report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python 3 (with caching)
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install pytest Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --group pytest -e .

      - name: Run pytest with coverage (pytest-cov)
        run: pytest

      - name: Generate PR coverage comment artifact
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'dependencies') && github.event.pull_request.user.type != 'Bot' }}
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR Comment to be Posted
        if: ${{ steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
          retention-days: 1

      - name: Store coverage data for default-branch publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1

  publish-coverage-data:
    name: Publish default-branch coverage data
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: pytest-coverage-data
          path: .

      - name: Publish coverage data
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
