name: Update Version and Create Zip on Release
on:
  workflow_dispatch:
  release:
    types: [published, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  update_version_and_create_zip:
    name: Update Version and Create Zip on Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false
          sparse-checkout: .github/scripts/update_release_version.py
          sparse-checkout-cone-mode: false

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Release events must package the release tag instead of a moving
          # target_commitish branch.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          path: release-payload

      - name: Update Release Version Files
        if: ${{ github.event_name == 'release' && github.event.release.draft == false }}
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          python release-tooling/.github/scripts/update_release_version.py \
            --tag-name "$TAG_NAME" \
            --manifest-path release-payload/custom_components/animated_scenes/manifest.json \
            --const-path release-payload/custom_components/animated_scenes/const.py

      - name: Resolve Release Target Branch
        id: release-target
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false }}
        env:
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        working-directory: release-payload
        run: |
          set -euo pipefail
          if git check-ref-format --branch "$TARGET_COMMITISH" >/dev/null 2>&1; then
            if git ls-remote --exit-code --heads origin \
              "refs/heads/$TARGET_COMMITISH" >/dev/null; then
              printf 'is_branch=true\nbranch=%s\n' "$TARGET_COMMITISH" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ $? -ne 2 ]]; then
              echo "Unable to resolve the release target against remote branches" >&2
              exit 1
            fi
          fi
          printf 'is_branch=false\n' >> "$GITHUB_OUTPUT"

      - name: Commit & Push Version Changes
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false && steps.release-target.outputs.is_branch == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: release-payload
          branch: ${{ steps.release-target.outputs.branch }}
          commit_message: 'Updating to version ${{ github.event.release.tag_name }} [skip ci]'

      - name: Update Release with Version Changes Commit
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false && steps.release-target.outputs.is_branch == 'true' }}
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        working-directory: release-payload
        run: |
          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"

      - name: Create Zip
        run: |
          cd ${{ github.workspace }}/release-payload/custom_components/animated_scenes
          zip animated_scenes.zip -r ./

      - name: Upload Zip to Release
        if: ${{ github.event_name == 'release' && github.event.release.draft == false }}
        uses: softprops/action-gh-release@v3
        with:
          files: ./release-payload/custom_components/animated_scenes/animated_scenes.zip
          tag_name: ${{ github.event.release.tag_name }}

      - name: Add Zip to Action
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: animated_scenes
          path: ./release-payload/custom_components/animated_scenes/animated_scenes.zip
          if-no-files-found: error
